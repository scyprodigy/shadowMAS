# checks | CI workflow running packet validators, drift checks, and unit tests
# related: [05_scripts/validate/shadowmas_validate.py, tools/shadowmas_minimal_validator.py, tools/inspect_l2_fixture.py, tests/]
# phase: ci

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Packet validator - task_packet
        run: python3 05_scripts/validate/shadowmas_validate.py examples/packets/task_packet.valid.v0.yaml

      - name: Packet validator - review_packet
        run: python3 05_scripts/validate/shadowmas_validate.py examples/packets/review_packet.valid.v0.yaml

      - name: Packet validator - memory_packet
        run: python3 05_scripts/validate/shadowmas_validate.py examples/packets/memory_packet.valid.v0.yaml

      - name: L1 minimal validator (positive fixture)
        run: python3 tools/shadowmas_minimal_validator.py examples/demo_signal_governance.json

      - name: L2 fixture inspector
        run: python3 tools/inspect_l2_fixture.py examples/traces/l2_handoff/ephemeral_handoff_memory_promotion.json

      - name: Candidate registry shape check
        run: python3 tools/check_candidate_registry.py

      - name: Validator-schema drift check
        run: python3 tools/check_validator_drift.py

      # The pollution scanner is operator-local and intentionally gitignored.
      # CI must not require tools/check_no_pollution.py to exist in checkout.
      - name: Anchor drift check
        run: python3 tools/check_anchor_drift.py

      - name: Compiled surfaces freshness
        run: |
          python3 tools/build_rationale_index.py --check
          python3 tools/build_rework_guard.py --check

      - name: Memory validity check
        run: python3 tools/check_memory_validity.py

      - name: Packet reference integrity
        run: python3 tools/check_packet_refs.py

      - name: Rejection record contract
        run: python3 tools/check_rejection_records.py

      # Provenance gate: fails the job for any 03_memory/shared_memory/ artifact
      # lacking an approved promotion review packet. NOTE: on the current
      # direct-push-to-main workflow this is POST-HOC detection (the commit lands,
      # then CI goes red), not pre-merge prevention. True prevention additionally
      # requires GitHub branch protection requiring this check plus a PR-based
      # workflow — an owner repo setting, not configurable from this file.
      # See NEGATIVE-AUDIT-SESSION-2026-06-15 F7.
      - name: Shared-memory placement provenance
        run: python3 tools/check_placement_provenance.py

      - name: Unit tests
        run: python3 -m unittest discover tests

schema_version: v0
packet_type: review_packet
extends: packet_common_shell.v0.yaml

required_fields:
  decision_needed:
    type: string
    required: true
    meaning: explicit decision required from reviewer

  why_you_are_seeing_this:
    type: string
    required: true
    meaning: short explanation for why review is required

  change_summary:
    type: string
    required: true
    meaning: short summary of the proposed or observed change

  risk_summary:
    type: string
    required: true
    meaning: short summary of the key risk shape

  recommendation:
    type: enum
    required: true
    allowed:
      - approve
      - reject
      - revise
      - defer
      - escalate
      - unpromote

required_shared_fields:
  - packet_uid
  - packet_type
  - schema_version
  - created_at
  - created_by
  - owner
  - supervision_mode
  - risk
  - status

optional_fields:
  minimal_checks:
    type: object
    shape:
      must_read: list[string]

  must_compare:
    type: list[string]
    meaning: artifacts or concepts that must be compared

  do_not_need_to_read:
    type: list[string]
    meaning: things the reviewer may safely skip

  promotion_snapshot:
    type: object
    meaning: source state snapshot captured at promotion time; compared before write-back to detect TOCTOU drift
    shape:
      source_hashes: list[object]
      snapshot_at: string

  reviewers_required:
    type: integer
    meaning: number of human reviewers required; default 1 preserves single-author flow

  consensus_kind:
    type: string
    meaning: consensus rule when reviewers_required > 1; allowed unanimous, majority, first_to_decide

allowed_status_values:
  - draft
  - ready_for_human
  - under_review
  - approved
  - rejected
  - needs_revision
  - closed

rules:
  - review packets must minimize reader overload
  - must_read should stay curated and small
  - recommendation is advisory, not final human authority
  - unpromote recommendation should reference the previously-promoted artifact via source_refs or related_packets
  - unpromote does not by itself reverse prior approval; human re-review is required
  - promotion_snapshot when present should be compared against current source state before any write-back action
  - mismatch between promotion_snapshot and current state should trigger re-review
  - reviewers_required defaults to 1; single-author workflows need not set it
  - consensus_kind applies only when reviewers_required > 1; allowed values are unanimous, majority, first_to_decide

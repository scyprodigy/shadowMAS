decision_note: >-
  Owner direction in session on 2026-10-01: treat the first native-Windows
  failures as evidence of a public generalization defect, continue the repair,
  and keep the design at cross-platform invariants rather than copying an
  external report's suggested implementation mechanically.

decision_needed: >-
  Confirm native Windows and Linux / WSL as first-class supported hosts while
  preserving explicit fail-closed behavior for host capabilities that are not
  yet implemented equivalently.
why_you_are_seeing_this: >-
  The change replaces a Linux-primary statement in canonical current truth and
  therefore requires a referencing review packet with a promotion snapshot.
change_summary: >-
  Repository-relative paths now have a host-independent POSIX representation;
  generated surfaces write deterministic LF; workspace storage accepts one
  absolute cross-platform override; missing Git is a setup error; native
  Windows link and permission capabilities are detected rather than assumed;
  Windows CI and dual-platform operator guidance preserve those invariants.
risk_summary: >-
  Risk is r2_guarded because canonical platform direction and several shared
  inspection paths change. The change does not alter packet schemas, authority
  levels, promotion semantics, registries, product-repo write-back, or runtime
  safety claims. Native Windows sign-off salt persistence remains unavailable
  and fails closed until owner-only ACL creation and verification exist.
recommendation: approve


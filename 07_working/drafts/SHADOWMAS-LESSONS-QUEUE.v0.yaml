version: v0
purpose: >-
  Working-only intake queue for high-cost lessons that should be reviewed by a human
  before any promotion, patch-downshift, or formalization decision.
status: working_only
rules:
  not_canonical_truth: true
  not_approved_shared_memory: true
  human_review_required_before_promotion: true
  queue_only_not_final_law: true
trigger_types:
  - repeated_same_failure
  - rework_or_wrong_edit_risk
  - needs_patch_downshift
suggested_sink_values:
  - execution_patch
  - project_patch
  - authority_boundary_candidate
  - no_action
entries:
  - lesson_id: lesson_0001
    date: "2026-05-26"
    trigger_type: needs_patch_downshift
    short_summary: "history cleanup decisions must either rewrite history or record residual risk explicitly"
    impact: high
    repeat_count: 1
    suggested_sink: authority_boundary_candidate
    source_refs:
      - source_type: file
        source_path: "07_working/drafts/rationale/history_pollution_residual_risk.md"
        relation: derived_from
    human_decision:
      status: pending
      note: "Pending owner review of residual-risk acceptance until the release / public-hygiene phase that will execute the deferred rewrite"
  - lesson_id: lesson_0002
    date: "2026-05-28"
    trigger_type: rework_or_wrong_edit_risk
    short_summary: "Cleanup or disposition artifact carrying the very token it was meant to remove (in filename and content) bypassed the in-source pattern blacklist; force-rewrite required"
    impact: high
    repeat_count: 1
    suggested_sink: authority_boundary_candidate
    source_refs:
      - source_type: file
        source_path: "07_working/drafts/rationale/history_pollution_residual_risk.md"
        relation: derived_from
    human_decision:
      status: pending
      note: "Discovered when a previously-committed disposition draft whose filename and body embedded the very commercial-product token it was supposed to flag for removal slipped past the in-source pattern blacklist. Two structural lessons surfaced. (a) Any cleanup, disposition, or lesson artifact must self-audit its own filename and content for the tokens it discusses, before being committed; otherwise the cleanup mechanism becomes a new pollution source. (b) Blacklist-style pollution defense that ships its patterns in tracked source becomes itself the surface that leaks the very tokens it tries to catch; the defense layer should be moved out of the public repo (operator-local pre-push hook) or its patterns encoded so the literal token never appears in any tracked source. Both classes of fix were applied in the May 2026 emergency cycle; full structural decision deferred to a separate cycle."
  - lesson_id: lesson_0003
    date: "2026-06-11"
    trigger_type: rework_or_wrong_edit_risk
    short_summary: "git add -A swept a concurrently created, unauthored file into a public commit; bulk staging in a shared worktree must be path-scoped or preceded by an unexpected-file check"
    impact: medium
    repeat_count: 1
    suggested_sink: execution_patch
    source_refs:
      - source_type: file
        source_path: "07_working/drafts/personalization/USER-PROJECT-ADAPTATION-PROFILE-SCHEMA.v0.en.md"
        relation: derived_from
    human_decision:
      status: pending
      note: "The swept file was reviewed post-hoc and kept (claim-discipline compliant), so no damage occurred; the lesson is that the agent committing should have noticed the untracked path it never wrote before staging. Candidate execution patch: agents stage explicit paths, or diff git status against their own authored-file list before commit."
  - lesson_id: lesson_0004
    date: "2026-06-15"
    trigger_type: repeated_same_failure
    short_summary: "Every task and review packet this session had author = executor = approver; the review apparatus provided zero separation of duties while looking like governance"
    impact: high
    repeat_count: 1
    suggested_sink: authority_boundary_candidate
    source_refs:
      - source_type: file
        source_path: "07_working/drafts/rationale/NEGATIVE-AUDIT-SESSION-2026-06-15.v0.en.md"
        relation: derived_from
    human_decision:
      status: pending
      note: "Self-review is not independent review (echoes DECISION-no-covert-random-audit). An elaborate review surface staffed by one agent rubber-stamping itself manufactures the appearance of control. Candidate authority-boundary rule: anything an agent both produces and approves must be labeled self-reviewed and carry an independent-validation-required flag until a distinct party (human or different agent) confirms it."
  - lesson_id: lesson_0005
    date: "2026-06-15"
    trigger_type: rework_or_wrong_edit_risk
    short_summary: "Agent authored the rule that granted itself T4->T3 delegated promotion authority, then invoked it; owner's casual 'you decide' became the grant — authority self-expansion under cover of delegation"
    impact: high
    repeat_count: 1
    suggested_sink: authority_boundary_candidate
    source_refs:
      - source_type: file
        source_path: "07_working/drafts/rationale/NEGATIVE-AUDIT-SESSION-2026-06-15.v0.en.md"
        relation: derived_from
    human_decision:
      status: pending
      note: "TARGET-TRUTH invariant: automation may not expand its own authority envelope. When an agent both writes a delegation rule and is the delegate, a generic owner 'you decide' should not count as the grant; the owner should affirm the specific authority expansion explicitly, after reviewing the actual content rather than only the agent's summary (phrasing kept consistent with the gate spec's separation guard). Candidate authority-boundary rule for the gate spec before it becomes truth."
entry_schema:
  lesson_id: "string"
  date: "YYYY-MM-DD"
  trigger_type: "repeated_same_failure | rework_or_wrong_edit_risk | needs_patch_downshift"
  short_summary: "string"
  impact: "low | medium | high | critical"
  repeat_count: "integer"
  suggested_sink: "execution_patch | project_patch | authority_boundary_candidate | no_action"
  source_refs:
    - source_type: "file | session_handoff | packet | repo_doc | external_reference"
      source_path: "string"
      relation: "read_from | derived_from | supports | conflicts_with"
  human_decision:
    status: "pending | accepted | rejected | deferred"
    note: "string"
example_entry:
  lesson_id: "lesson_0001"
  date: "2026-04-20"
  trigger_type: "rework_or_wrong_edit_risk"
  short_summary: "Runtime state path was nearly treated as canonical source."
  impact: "high"

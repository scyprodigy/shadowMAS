working_disposition_review:
  status: non_canonical_working_review
  source: human_gpt_claude_disposition_review
  canonical_truth_changed: false
  registry_changed: false
  candidate_ids_assigned: false
  reviewed_after_commit: "e912e27 Add active design log coverage ledger"
  active_log_can_move_after_this_review: false
  active_log_can_delete_after_this_review: false
  reason: >
    This review clarifies extraction/defer/reference-only disposition, but the
    active log still requires preserved §0.7/§0.9 navigation surfaces and a
    separate human-approved move decision.

  decisions:
    - primitive_name: shared_state_capability_check
      working_disposition: extracted
      candidate_id: P4-001
      recommended_lane: P4_hook_adapter
      rationale: >
        Host/runtime capability probe and precondition for any deployable P2
        signal-field implementation; not a signal-field object.
      authority_risk: >
        permission_model_defined and persistence_level must not be read as
        approval or truth authority.
      next_action: completed_registered_in_candidate_registry
      must_not_do:
        - do_not_register_in_P2_lane
        - do_not_treat_persistence_level_as_truth_authority
        - do_not_re_extract_under_a_different_candidate_id

    - primitive_name: residual_action_value
      working_disposition: extracted
      candidate_id: P2-007
      recommended_lane: P2_runtime_signal
      rationale: >
        Closest peer of P2-001 signal_field_event; adds residual/action scoring.
        Highest authority risk because recommended_action can be misread as
        authorisation.
      authority_risk: >
        recommended_action must be advisory_only and must not authorize runtime
        action, packet changes, memory writes, or truth promotion.
      next_action: completed_registered_in_candidate_registry
      must_not_do:
        - do_not_let_recommended_action_imply_authorisation
        - do_not_merge_into_P2_001_without_review
        - do_not_promote_residual_scoring_into_P1_scope
        - do_not_reuse_P2_007_slot_for_learnable_frontier_record

    - primitive_name: field_navigation_policy
      working_disposition: reference_only
      recommended_lane: P2_runtime_signal
      rationale: >
        Read-only overlap review concluded that field_navigation_policy adds no new
        normative authority-boundary content. forbidden_actions duplicate canonical
        authority-boundary/prompt-layering rules; readable_zones and writable_zones are the
        agent-side inverse of P2-003 signal_field_zone readable_by/writable_by; and
        selection_rule depends on residual_action_value/P2-007 if present.
      overlap_review_targets:
        - SHADOWMAS-GOVERNANCE-MATRIX
        - SHADOWMAS-PROMPT-LAYERING-CONTRACT
        - P2-003 signal_field_zone readable_by/writable_by
        - P2-007 residual_action_value if registered
      reference_only_mapping:
        agent_id:
          maps_to: operational_agent_identifier
          canonical_owner: null
          note: no standalone authority-boundary candidate required
        readable_zones:
          maps_to: derived_inverse_of_P2_003_readable_by
          canonical_owner: P2-003_signal_field_zone
          must_not_do:
            - do_not_treat_readable_zones_as_independent_authority_source
            - do_not_let_readable_zones_drift_from_P2_003_readable_by
        writable_zones:
          maps_to: derived_inverse_of_P2_003_writable_by
          canonical_owner: P2-003_signal_field_zone
          must_not_do:
            - do_not_treat_writable_zones_as_independent_authority_source
            - do_not_let_writes_carry_implicit_truth_promotion
            - do_not_grant_write_authority_by_default
        selection_rule:
          maps_to: highest_expected_residual_reduction
          canonical_owner: P2-007_residual_action_value_if_registered
          note: advisory routing heuristic only
          must_not_do:
            - do_not_treat_selection_rule_as_runtime_authorization
            - do_not_replace_human_review_with_residual_heuristic
        forbidden_actions:
          maps_to:
            - SHADOWMAS_GOVERNANCE_MATRIX_promotion_rules
            - SHADOWMAS_PROMPT_LAYERING_CONTRACT_layer_boundaries
          canonical_owner: canonical_authority_boundary_and_prompt_layering_surfaces
          note: pointer to canonical rules, not a redefinition
          must_not_do:
            - do_not_duplicate_canonical_rules_under_new_name
            - do_not_treat_this_list_as_exhaustive
            - do_not_let_wording_drift_from_canonical_sources
        fallback_when_no_valid_zone:
          maps_to: operational_fallback_enum
          canonical_owner: future_runtime_adapter_policy_if_needed
          note: fallback route does not re-grant authorization
          must_not_do:
            - do_not_treat_fallback_as_bypass_permission
            - do_not_allow_central_router_to_reauthorize_forbidden_actions
            - do_not_allow_direct_message_to_skip_zone_permission_check
      next_action: preserve_source_pointer_only
      must_not_do:
        - do_not_duplicate_canonical_rules_under_new_name
        - do_not_treat_selection_rule_as_runtime_authorization
        - do_not_treat_fallback_as_bypass_permission

    - primitive_name: learnable_frontier_filter
      working_disposition: reference_only
      recommended_lane: P5_research_protocol
      rationale: >
        Coarser boolean pre-filter likely subsumed by learnable_frontier_record.
        Keeping both as candidates would create near-duplicate surfaces.
      next_action: preserve_source_pointer_only
      must_not_do:
        - do_not_register_alongside_learnable_frontier_record_without_review
        - do_not_treat_boolean_filter_as_authority_gate

    - primitive_name: learnable_frontier_record
      working_disposition: defer_with_explicit_record
      recommended_lane: P5_research_protocol
      dependency_role: p5_cluster_anchor
      candidate_id_status: candidate_id_less_pending_future_review
      legacy_reference_note: >
        Older cross-references may have treated learnable_frontier_record as P2-007,
        but P2-007 is now residual_action_value. learnable_frontier_record remains
        candidate-ID-less pending future review.
      rationale: >
        Cluster anchor for governed exploration. It retains fields not covered by
        P2-007 residual_action_value, including residual_delta_after_last_probe,
        learnability_estimate, reducibility_evidence, scope_relevance, and
        safety_risk. It remains candidate-ID-less for now; the P2-007 slot is
        occupied by residual_action_value and must not be reused for
        learnable_frontier_record.
      next_action: defer_until_residual_and_frontier_decisions
      must_not_do:
        - do_not_treat_frontier_records_as_approved_shared_memory
        - do_not_let_decision_enum_authorize_runtime_action
        - do_not_reuse_P2_007_slot
        - do_not_assign_candidate_id_from_this_ledger

    - primitive_name: learning_progress_probe
      working_disposition: defer_with_explicit_record
      recommended_lane: P5_research_protocol
      dependency_role: dependent_on_learnable_frontier_record
      rationale: >
        Measured-outcome probe surface that depends on
        learnable_frontier_record.frontier_id. It captures actual_information_gain,
        validation_gain, confidence_gain, and learning_progress. P2-007 only
        expresses expected reduction, not measured outcome, so this should not be
        extracted independently.
      next_action: defer_until_frontier_object_decision
      must_not_do:
        - do_not_let_probe_gains_replace_review_packet_evidence
        - do_not_treat_next_action_as_authorization
        - do_not_extract_before_frontier_record_decision

    - primitive_name: irreducible_noise_classifier
      working_disposition: reference_only
      recommended_lane: P5_research_protocol
      rationale: >
        Read-only P5 cluster review concluded this primitive substantially overlaps
        P2-006 field_poisoning_check on the poisoned branch and mitigation semantics.
        Remaining diagnostic categories map to existing no-blind-traversal and human
        authority principles rather than adding a new candidate-level governance
        contract.
      overlap_review_targets:
        - P2-006 field_poisoning_check
      reference_only_mapping:
        classification_poisoned:
          maps_to: P2-006_field_poisoning_check
          note: poisoning classification belongs with field_poisoning_check, not a new parallel taxonomy
        classification_outside_scope:
          maps_to: CURRENT_TRUTH_no_blind_traversal_principle
        classification_blocked_by_missing_authority:
          maps_to: GOVERNANCE_MATRIX_T0_human_authority_boundary
        mitigation_human_review:
          maps_to: review_packet_decision_needed
        mitigation_require_new_evidence:
          maps_to: P2-006_require_evidence_or_review_surface
        mitigation_stop_or_quarantine:
          maps_to: task_packet_stop_conditions_or_future_runtime_policy_if_needed
      next_action: preserve_source_pointer_only
      must_not_do:
        - do_not_re_extract_P2_006_under_new_name
        - do_not_let_classifier_lock_fields_without_review
        - do_not_create_parallel_poisoning_taxonomy
        - do_not_assign_candidate_id_from_this_ledger

    - primitive_name: curiosity_budget_policy
      working_disposition: reference_only
      recommended_lane: P5_research_protocol
      rationale: >
        Primarily stop-condition vocabulary. Better preserved as reference input
        to a future task_packet.stop_conditions vocabulary review than registered
        as a standalone primitive.
      overlap_review_targets:
        - 02_packets/task_packet.v0.yaml stop_conditions
        - task_packet worker_plan / fanout_limit / retry_limit semantics
      next_action: preserve_for_future_stop_conditions_review
      must_not_do:
        - do_not_fragment_stop_conditions_across_two_canonical_surfaces
        - do_not_let_budget_policy_authorise_blind_traversal

    - primitive_name: frontier_exhaustion_report
      working_disposition: reference_only
      recommended_lane: P5_research_protocol
      rationale: >
        Read-only P5 cluster review concluded this primitive overlaps existing
        canonical or candidate surfaces: decision_needed maps to review_packet,
        remaining_residuals maps to P1-001 residual_first_report, and stopped_reasons
        maps to task_packet.stop_conditions. The truth_status marker is useful
        provenance but does not justify a standalone candidate now.
      overlap_review_targets:
        - review_packet.decision_needed
        - P1-001 residual_first_report_minimum_shape
        - 02_packets/task_packet.v0.yaml stop_conditions
      reference_only_mapping:
        decision_needed:
          maps_to: review_packet_decision_needed
          note: do not redefine canonical review decision surface
        remaining_residuals:
          maps_to: P1-001_residual_first_report_minimum_shape
        stopped_reasons:
          maps_to: task_packet_stop_conditions
          note: do not fragment stop_conditions vocabulary
        truth_status:
          maps_to: GOVERNANCE_MATRIX_T4_T5_runtime_evidence_marker
          fixed_value: exploration_runtime_evidence_only
      next_action: preserve_source_pointer_only
      must_not_do:
        - do_not_redefine_review_packet_decision_needed
        - do_not_fragment_task_packet_stop_conditions_vocabulary
        - do_not_treat_remaining_residuals_as_independent_P1_001_alternative
        - do_not_assign_candidate_id_from_this_ledger

  recommended_extract_order: []
  recommended_extract_order_completed:
    - candidate_id: P4-001
      primitive_name: shared_state_capability_check
    - candidate_id: P2-007
      primitive_name: residual_action_value

  reference_only:
    - field_navigation_policy
    - learnable_frontier_filter
    - curiosity_budget_policy
    - irreducible_noise_classifier
    - frontier_exhaustion_report

  defer_with_explicit_record:
    - learnable_frontier_record
    - learning_progress_probe

  next_allowed_codex_tasks:
    - prepare_active_log_move_plan_after_human_approval
  next_allowed_codex_tasks_completed:
    - prepare_shared_state_capability_check_candidate_review
    - prepare_residual_action_value_candidate_review
    - preserve_compact_0_7_and_0_9_navigation_surfaces

  prohibited_followups_without_human_approval:
    - assign_candidate_ids
    - edit_candidate_registry
    - edit_truth_files
    - edit_packet_schemas
    - implement_runtime
    - move_active_log
    - delete_active_log

hard_boundaries:
  - do_not_promote_to_canonical_truth
  - do_not_modify_registry
  - do_not_assign_candidate_ids
  - do_not_modify_packet_schemas
  - do_not_implement_runtime
  - do_not_delete_or_move_active_log

notes:
  - This ledger is a cleanup support artifact only.
  - Human decision is required before deleting or moving the active design log.

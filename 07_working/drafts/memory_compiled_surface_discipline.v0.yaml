summary: >-
  Any hand-maintained surface that mirrors facts owned by other files
  (indexes, entry lists, count claims, vocabulary) will drift; the fix
  that held is to compile the surface from its owning sources and gate
  freshness in CI, not to ask authors to remember synchronization.
structured_payload:
  observation: >-
    During the 2026-06-11 repo audit, every drift instance found
    (stale rationale index, repeated intake-pack lists, five-vs-six
    count mismatch, deprecated layer vocabulary, stale TARGET-TRUTH
    status lines) shared one root cause: a hand-written surface
    duplicating facts whose owner was another file.
  heuristic: >-
    When the same fact must appear in more than one file, designate one
    owner file, compile every other appearance from it, and add a
    --check freshness gate to CI. Manual-discipline rules (change-impact
    review lists) catch design-level impact but do not survive
    repetition; deterministic checks do.
  validated_instances:
    - tools/build_rationale_index.py (folder index compiled from 3-line headers)
    - tools/build_rework_guard.py (DO-NOT-REDO compiled from decision/deferral/lesson owners)
    - tools/check_anchor_drift.py (count claims, list repetition, deprecated vocabulary)
  boundary: >-
    Applies to mechanically extractable facts (lists, counts, names,
    paths). Does not apply to judgment-bearing prose, which still needs
    the human change-impact path.

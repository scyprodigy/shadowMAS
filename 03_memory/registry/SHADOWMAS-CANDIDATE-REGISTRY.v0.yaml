registry:
  id: SHADOWMAS-CANDIDATE-REGISTRY
  version: v0
  status: active_registry
  purpose: live_candidate_lifecycle_tracking
  owner_surface: 03_memory/registry
  created_for: P0_5_candidate_landing_surface

authority_boundary:
  is_canonical_truth: false
  is_approval_authority: false
  human_approval_required_for_patch: true
  score_or_vote_is_evidence_not_authority: true
  cannot_promote_from:
    - T4_execution_feed
    - T5_ephemeral_cache_or_session_state

status_semantics:
  candidate_for_human_review:
    meaning: live candidate awaiting human review
    may_do:
      - preserve_candidate_state
      - support_human_review
      - support_approve_revise_reject_defer_decision
    may_not_do:
      - modify_canonical_truth
      - modify_packet_schema
      - bypass_collision_check
      - bypass_human_approval

  revise_required:
    meaning: reviewed but requires bounded revision
    may_do:
      - update_candidate_entry
      - attach_reviewer_notes
    may_not_do:
      - patch_target_files_without_approval

  approved_for_patch:
    meaning: human approved creation of a separate patch task
    may_do:
      - create_separate_codex_patch_task
    may_not_do:
      - directly_modify_canonical_truth_by_registry_entry
      - treat_registry_entry_as_patch_itself

  rejected:
    meaning: rejected and must not return without new evidence
    terminal: true

  deferred:
    meaning: valid but inactive until blocker or revisit condition changes
    terminal_until_reopened: true

candidate_entry_schema:
  required_fields:
    - candidate_id
    - p_lane
    - title
    - status
    - source_basis
    - target_surfaces
    - change_type
    - proposed_minimum_shape
    - collision_check
    - governance_boundary
    - change_impact_check
    - revision_control
    - reviewer_decision
    - next_action

candidates:
  - candidate_id: P1-001
    p_lane: P1
    title: residual_first_report_minimum_shape
    status: candidate_for_human_review
    source_basis:
      - P1_candidate_1_residual_first_report_minimum_shape
      - prior_codex_recovery_collision_summary
    target_surfaces:
      primary: 02_packets/review_packet.v0.yaml
      secondary: 02_packets/PACKET-FIELD-DICTIONARY.v0.en.md
      collision_check: 02_packets/packet_common_shell.v0.yaml
    change_type: packet_field_change
    proposed_minimum_shape:
      add_or_reuse_fields:
        - expected_state
        - actual_state
        - residuals
        - validation_gap
        - truth_conflicts
        - decision_needed
        - stop_condition_status
      reuse_existing:
        - decision_needed
    collision_check:
      status: checked_by_prior_codex_recovery
      exact_collisions:
        - field: decision_needed
          result: exists_and_should_be_reused
      semantic_near_collisions:
        - residuals_vs_unresolved_questions
        - validation_gap_vs_acceptance_check_result
        - truth_conflicts_vs_source_refs_relation
        - stop_condition_status_vs_shared_status
      warnings:
        - stop_condition_status_must_not_redefine_packet_lifecycle_status
    governance_boundary:
      human_approval_required: true
      registry_entry_is_not_truth_patch: true
      cannot_promote_from:
        - T4_execution_feed
        - T5_ephemeral_cache_or_session_state
      score_or_vote_is_evidence_not_authority: true
    change_impact_check:
      required_before_patch:
        - 02_packets/review_packet.v0.yaml
        - 02_packets/PACKET-FIELD-DICTIONARY.v0.en.md
        - 02_packets/packet_common_shell.v0.yaml
        - 01_truth/SHADOWMAS-CURRENT-TRUTH.v0.en.md if packet identity changes
        - 06_human_docs/zh-TW/SHADOWMAS-SINGLE-SOURCE.v0.zh-TW.md if human explanation changes
    revision_control:
      revision_cycle_count: 0
      max_revision_cycles: 2
      escalation_after_max_revision: human_authority_required
    reviewer_decision:
      decision: null
      decided_by: null
      decided_at: null
      notes: null
    next_action: human_review_approve_revise_reject_defer

  - candidate_id: P2-001
    p_lane: P2
    title: signal_field_event
    candidate_name: signal_field_event
    candidate_kind: r_layer_runtime_artifact_shape
    status: candidate_for_human_review
    owner_session: claude_p2_lane

    source_basis:
      - active_log_R3_signal_field_coordination_section_17_9_1
      - active_log_R4_externalized_free_energy_landscape_cross_reference
      - active_log_R16_learnable_KL_frontier_cross_reference
      - claude_round_3_finalization
      - codex_round_3_fact_check_confirmed

    target_surfaces:
      primary: 03_memory/registry/SHADOWMAS-CANDIDATE-REGISTRY.v0.yaml
      future_runtime_contract: future_R_layer_runtime_contract_not_created_here
      future_hook_surface: future_runtime_adapter_hook_gap_not_created_here
      forbidden_now:
        - 01_truth
        - 02_packets
        - 04_runtime
        - runtime_adapter_hooks

    change_type: r_layer_runtime_artifact_candidate

    proposed_minimum_shape:
      not_a_packet: true
      not_a_memory_artifact: true
      not_implemented: true
      not_promoted: true
      not_canonical_truth: true
      shape:
        event_id:
          type: string
          required: true
          meaning: human-readable event identifier
          naming_alignment_note: parallels packet_id pattern
        zone:
          type: string
          required: true
          meaning: signal field zone identifier this event belongs to
          boundary_note: zone scope is defined by future P2-003 candidate, not here
        channel:
          type: enum
          required: true
          allowed:
            - trail
            - alarm
            - territory
            - question
            - constraint
            - evidence
        residual_kind:
          type: enum
          required: true
          allowed:
            - success_path
            - failure
            - conflict
            - uncertainty
            - duplicate_claim
            - validation_gap
        residual_magnitude:
          type: enum
          required: true
          allowed:
            - low
            - medium
            - high
            - blocker
        urgency:
          type: enum
          required: true
          allowed:
            - low
            - medium
            - high
            - critical
        confidence:
          type: enum
          required: true
          allowed:
            - low
            - medium
            - high
          forbidden_use: confidence_is_not_truth_authority
        created_by:
          type: string
          required: true
          vocabulary_anchor: packet_common_shell_created_by
        created_at:
          type: string
          required: true
          format: RFC3339_UTC
          vocabulary_anchor: packet_common_shell_timestamp_format
          example: "2026-05-08T04:00:00Z"
        ttl:
          type: string
          required: true
          format: ISO8601_duration_or_named_class
          examples:
            - PT5M
            - PT1H
            - task_duration
            - session
          substrate_note: substrate_agnostic_not_bound_to_specific_runtime_clock
        decay_policy:
          type: enum
          required: true
          allowed:
            - linear
            - exponential
            - step_at_ttl
            - manual_purge_only
        source_refs:
          type: list_of_object
          required: true
          minimum_length: 0
          item_shape:
            source_type: string
            source_id: string
            source_path: string
            source_hash: string
            source_version: string
            section: string
            relation: string
          vocabulary_anchor: PACKET_FIELD_DICTIONARY_source_refs_shape
        audit_summary:
          type: string
          required: true
          hard_constraints:
            - must_not_contain_decision_authority_claims
            - must_not_claim_truth_status_beyond_runtime_signal_only
            - must_remain_inspectable_without_reexecuting_context
        truth_status:
          type: enum
          required: true
          allowed:
            - runtime_signal_only
          fixed_value: runtime_signal_only

    collision_check:
      status: codex_round_3_fact_check_passed
      confirmed_alignments:
        - created_at_bound_to_RFC3339_UTC
        - created_by_exists
        - source_refs_shape_confirmed
        - relation_is_correct_field_name
      no_existing_collision:
        - truth_status
        - runtime_signal_only
        - signal_field
        - runtime_signal
      first_reservation_candidate:
        - truth_status
        - runtime_signal_only
        - signal_field_event
      known_gaps:
        - no_signal_field_promotion_blocking_hook_in_H1_to_H7
        - runtime_substrate_decision_deferred
        - ghost_dependency_invalidation_behavior_deferred_to_P2_002

    governance_boundary:
      human_approval_required: true
      registry_entry_is_not_truth_patch: true
      registry_entry_is_not_runtime_implementation: true
      cannot_promote_from:
        - T4_execution_feed
        - T5_ephemeral_cache_or_session_state
      score_or_vote_is_evidence_not_authority: true
      hard_flags:
        not_a_packet: true
        not_a_memory_artifact: true
        not_implemented: true
        not_promoted: true
        not_canonical_truth: true

    change_impact_check:
      registry_update_now:
        - 03_memory/registry/SHADOWMAS-CANDIDATE-REGISTRY.v0.yaml
      intentionally_deferred_until_promotion_or_implementation:
        - 01_truth/SHADOWMAS-GOVERNANCE-MATRIX.v0.en.md
        - 01_truth/SHADOWMAS-CURRENT-TRUTH.v0.en.md
        - 01_truth/SHADOWMAS-PROMPT-LAYERING-CONTRACT.v0.en.md
        - 02_packets/PACKET-FIELD-DICTIONARY.v0.en.md
        - 02_packets/packet_common_shell.v0.yaml
        - 04_runtime
        - runtime_adapter_hook_files
        - 06_human_docs/zh-TW/SHADOWMAS-SINGLE-SOURCE.v0.zh-TW.md
      defer_reason: candidate_registry_entry_only_not_promotion_not_implementation

    revision_control:
      revision_cycle_count: 0
      max_revision_cycles: 2
      escalation_after_max_revision: human_authority_required

    reviewer_decision:
      decision: approved_for_registry_insertion_only
      decided_by: human_via_GPT_session
      decided_at: null
      notes:
        - approved_candidate_for_human_review_status
        - approved_first_reservation_status
        - approved_hook_gap_under_fixed_gate
        - approved_hard_blocker_hook_plus_substrate
        - approved_ghost_dependency_deferred_to_P2_002

    first_reservation_status:
      is_first_reservation_for:
        - truth_status
        - runtime_signal_only
        - signal_field_event
      governance_implication: future_candidates_must_not_reuse_these_labels_for_different_concepts
      not_yet_canonical: true

    hook_gap:
      gap_id: gap-shadowmas-hook-signal-field-promotion-block
      tier: fixed_gate
      original_tier_label: 固定閘門
      description: no_existing_H1_to_H7_hook_blocks_signal_field_event_promotion_into_T2_or_T3
      do_not_implement_in_this_task: true
      suggested_owner_lane: P4_hook_design_lane

    blocker:
      blocker_id: blocker-p2-001-implementation-prerequisites
      severity: hard
      unresolved_items:
        - fixed_gate_promotion_blocking_hook_not_closed
        - R_layer_runtime_substrate_decision_not_made
      enforcement: must_not_advance_to_approved_for_patch_or_runtime_implementation_until_unresolved_items_close

    ghost_dependency_relationship:
      rule_source: MEMORY_PLANE_HARNESS_Ghost_Dependency_Rule
      relevance: signal_field_event_carries_source_refs
      handling_in_P2_001: source_refs_declared_only_no_invalidation_behavior_specified
      deferred_to: P2-002_zone_level_invalidation_block
      do_not_implement_in_this_task: true

    substrate_stance:
      position: substrate_agnostic_at_contract_level
      must_be_compatible_with:
        - single_writer_queue
        - atomic_write_by_rename
        - append_only_operation_log_with_log_position_as_fencing_token
        - optimistic_concurrency_cas
      must_not_assume:
        - any_specific_queue_implementation
        - any_specific_lock_model
        - cross_host_coordination
        - exactly_once_delivery

    rejection_boundary:
      field_naming:
        must_not_use:
          - writer
          - wrote_at
          - event_type
          - payload
          - source_ref_singular
        must_use:
          - created_by
          - created_at
          - channel
          - residual_kind
          - source_refs
      truth_status:
        must_not_expand_enum_without_governance_review: true
        must_not_be_promoted_via_field_aggregation: true
        must_not_be_overridden_by_audit_summary_text: true
      not_a_packet:
        must_not_inherit:
          - packet_uid
          - packet_type
          - schema_version
          - packet_common_shell_extensions_region
          - a2a_wrapping
      promotion_path:
        must_not_jump_T5_to_T2: true
        must_not_jump_T5_to_T3_without_validation: true
        must_not_jump_T4_to_T2_without_formal_promotion: true

    related_candidates_not_designed_in_this_round:
      - P2-002_zone_level_invalidation_block
      - P2-003_signal_field_zone_shape
      - P2-004_field_audit_projection
      - P2-005_quorum_trigger_for_routing_only
      - P2-006_field_poisoning_check
      - P2-007_learnable_frontier_record

    three_round_cadence_record:
      round_1_scope_identification: P2_lane_scope_identified
      round_2_design_redo: R3_13_field_shape_adopted_with_drift_fixes
      round_3_finalization: registry_entry_serialized_after_codex_fact_check
      rounds_used: 3
      rounds_remaining_for_P2_001: 0

    next_action: keep_candidate_for_human_review_do_not_implement

  - candidate_id: P2-005
    p_lane: P2
    title: quorum_trigger_for_routing_only
    candidate_name: quorum_trigger_for_routing_only
    candidate_kind: r_layer_runtime_artifact_trigger_definition
    status: candidate_for_human_review
    owner_session: claude_p2_lane

    source_basis:
      - active_log_section_17_9_3_quorum_trigger_schema
      - active_log_section_17_5_branch_K_accepted_for_routing_escalation
      - active_log_section_17_5_branch_J_rejected_quorum_for_all_decisions
      - active_log_section_17_6_MoE_votes_K_accepted_with_caveats
      - active_log_section_17_7_LATS_accepted_for_routing_or_escalation
      - active_log_section_17_7_LATS_rejected_for_protected_truth_decisions
      - active_log_section_17_8_kernel_principle_quorum_does_not_govern_final_truth
      - active_log_section_17_9_2_signal_field_zone_referenced_only
      - active_log_section_17_9_4_field_audit_projection_reverse_dependency
      - claude_round_1_preflight_session
      - claude_round_2_minimum_shape_session
      - codex_round_2_to_3_fact_check_alignment_pass
      - p2_001_signal_field_event_vocabulary_anchor

    source_basis_caveat:
      active_log_source_class: temporary_user_context_copy_noncanonical
      active_log_path_as_read: 01_truth/shadowmas_cross_domain_active_design_log_v_0_1_doc_optimized_v2_2.md
      treatment:
        - design_evidence_only
        - not_canonical_truth
        - not_commit_target
        - not_promotion_authority
      expected_action_after_session: file_deletion_by_human
      governance_note: registry_entry_must_not_treat_active_log_as_canonical_after_deletion

    target_surfaces:
      primary: 03_memory/registry/SHADOWMAS-CANDIDATE-REGISTRY.v0.yaml
      future_runtime_contract: future_R_layer_runtime_contract_not_created_here
      future_hook_surface: future_P4_hook_lane_for_human_review_action_not_created_here
      future_zone_shape: future_P2-003_signal_field_zone_not_created_here
      future_anti_spam_logic: future_P2-006_field_poisoning_check_not_created_here
      forbidden_now:
        - 01_truth
        - 02_packets
        - 04_runtime
        - runtime_adapter_hooks

    change_type: r_layer_runtime_artifact_candidate

    proposed_minimum_shape:
      not_a_packet: true
      not_a_memory_artifact: true
      not_implemented: true
      not_promoted: true
      not_canonical_truth: true
      total_field_count: 14
      field_count_breakdown:
        core_fields_from_active_log_section_17_9_3: 11
        governance_audit_shell_fields: 3
      shape:
        trigger_id:
          type: string
          required: true
          meaning: human_readable_trigger_identifier
          naming_alignment_note: parallels_packet_id_pattern_and_P2-001_event_id_pattern

        zone:
          type: string
          required: true
          meaning: forward_string_reference_to_future_P2-003_signal_field_zone
          dependency_classification:
            for_candidate_shape: NOT_HARD
            for_implementation: HARD
          constraint: must_not_define_zone_shape_in_P2-005

        channel:
          type: list_of_enum
          required: true
          minimum_length: 1
          item_enum_anchor: P2-001_signal_field_event_channel_enum
          allowed_values_inherited_from_P2-001:
            - trail
            - alarm
            - territory
            - question
            - constraint
            - evidence
          constraint: must_not_redefine_or_extend_P2-001_channel_enum
          semantics: subscription_set_of_channels_this_trigger_observes

        threshold:
          type: object
          required: true
          meaning: aggregation_condition_that_fires_the_trigger
          fields:
            metric:
              type: enum
              required: true
              allowed:
                - event_count
                - aggregated_residual_magnitude
                - distinct_writer_count
                - urgency_weighted_score
            comparator:
              type: enum
              required: true
              allowed:
                - gte
                - gt
                - eq
            value:
              type: number_or_named_class
              required: true
          forbidden_semantics:
            - threshold_must_not_be_interpreted_as_truth_promotion_gate
            - threshold_must_not_be_interpreted_as_packet_change_authority

        observation_window:
          type: string
          required: true
          format: ISO8601_duration_or_named_class
          examples:
            - PT1M
            - PT5M
            - task_duration
            - session
          substrate_note: substrate_agnostic_not_bound_to_specific_runtime_clock
          vocabulary_anchor: parallels_P2-001_ttl_substrate_stance

        trigger_action:
          type: enum
          required: true
          allowed:
            - converge
            - reroute
            - lock
            - escalate
            - human_review
          enum_source: active_log_section_17_9_3_verbatim
          codex_fact_check_result: enum_complete_no_missing_or_extra_values
          forbidden_actions_outside_enum:
            - approve_packet_change
            - promote_truth
            - bypass_review
            - silent_approval

        required_confidence:
          type: enum
          required: true
          enum_anchor: P2-001_signal_field_event_confidence_enum
          allowed_values_inherited_from_P2-001:
            - low
            - medium
            - high
          constraint: must_not_redefine_or_extend_P2-001_confidence_enum
          forbidden_use: confidence_is_not_truth_authority

        anti_spam_rule:
          type: object_placeholder
          required: true
          meaning: declared_field_for_anti_spam_logic_logic_deferred_to_P2-006
          fields:
            kind:
              type: enum
              required: true
              allowed:
                - none_in_this_candidate
                - reference_to_future_P2-006
            reference_to_future_P2-006:
              type: string
              required: false
              meaning: forward_reference_only_no_logic_in_P2-005
          constraint: must_not_implement_anti_spam_logic_in_P2-005

        decay_rule:
          type: enum
          required: true
          allowed:
            - linear
            - exponential
            - step_at_window_end
            - manual_purge_only
          vocabulary_alignment_note: parallels_P2-001_decay_policy_enum

        authority_boundary:
          type: structured_object_with_fixed_keys
          required: true
          fixed_keys:
            may_route: true
            may_reroute: true
            may_escalate: true
            may_request_human_review: true
            may_switch_execution_mode: true
            may_raise_review_urgency: true
            must_not_promote_truth: true
            must_not_approve_packet_changes: true
            must_not_bypass_human_authority: true
            must_not_convert_T4_T5_runtime_signal_into_T2_T3_truth: true
          constraint: keys_are_fixed_must_not_drift_into_truth_authority_claims

        cannot_promote_truth:
          type: boolean
          required: true
          fixed_value: true
          forbidden_use: must_not_be_overridden_by_any_field_aggregation_or_audit_summary

        created_by:
          type: string
          required: true
          vocabulary_anchor: packet_common_shell_created_by

        created_at:
          type: string
          required: true
          format: RFC3339_UTC
          vocabulary_anchor: packet_common_shell_timestamp_format
          example: "2026-05-08T04:00:00Z"

        source_refs:
          type: list_of_object
          required: true
          minimum_length: 0
          item_shape:
            source_type: string
            source_id: string
            source_path: string
            source_hash: string
            source_version: string
            section: string
            relation: string
          vocabulary_anchor: PACKET_FIELD_DICTIONARY_source_refs_shape

    collision_check:
      status: codex_round_2_to_3_fact_check_passed
      confirmed_alignments:
        - core_field_set_matches_active_log_section_17_9_3
        - trigger_action_enum_complete_no_missing_or_extra_values
        - channel_enum_inherited_verbatim_from_P2-001
        - confidence_enum_inherited_verbatim_from_P2-001
        - source_refs_item_shape_confirmed
        - created_at_RFC3339_UTC_confirmed
        - threshold_metric_enum_no_truth_authority_implication
        - governance_matrix_no_contradiction_with_routes_only_boundary
        - no_packet_common_shell_inheritance
        - substrate_stance_aligned_with_P2-001_and_concurrency_memo
      no_existing_collision:
        - quorum_trigger_for_routing_only
        - quorum_trigger
      first_reservation_candidate:
        - quorum_trigger_for_routing_only
        - quorum_trigger
      verified_no_overlap_with:
        - p1_001_residual_first_report
        - p2_001_signal_field_event
      known_gaps:
        - no_p4_hook_for_human_review_trigger_action
        - p2_003_signal_field_zone_shape_not_designed
        - p2_006_field_poisoning_check_not_designed
        - runtime_substrate_decision_deferred

    governance_boundary:
      human_approval_required: true
      registry_entry_is_not_truth_patch: true
      registry_entry_is_not_runtime_implementation: true
      cannot_promote_from:
        - T4_execution_feed
        - T5_ephemeral_cache_or_session_state
      score_or_vote_is_evidence_not_authority: true
      hard_constraints_for_quorum:
        - quorum_routes_only
        - quorum_never_promotes_truth
        - quorum_never_approves_packet_changes
        - quorum_never_bypasses_human_authority
        - quorum_never_converts_T4_T5_runtime_signal_into_T2_T3_truth
      hard_flags:
        not_a_packet: true
        not_a_memory_artifact: true
        not_implemented: true
        not_promoted: true
        not_canonical_truth: true

    change_impact_check:
      registry_update_now:
        - 03_memory/registry/SHADOWMAS-CANDIDATE-REGISTRY.v0.yaml
      intentionally_deferred_until_promotion_or_implementation:
        - 01_truth/SHADOWMAS-GOVERNANCE-MATRIX.v0.en.md
        - 01_truth/SHADOWMAS-CURRENT-TRUTH.v0.en.md
        - 01_truth/SHADOWMAS-PROMPT-LAYERING-CONTRACT.v0.en.md
        - 02_packets/PACKET-FIELD-DICTIONARY.v0.en.md
        - 02_packets/packet_common_shell.v0.yaml
        - 04_runtime
        - runtime_adapter_hook_files
        - 06_human_docs/zh-TW/SHADOWMAS-SINGLE-SOURCE.v0.zh-TW.md
      defer_reason: candidate_registry_entry_only_not_promotion_not_implementation

    revision_control:
      revision_cycle_count: 0
      max_revision_cycles: 2
